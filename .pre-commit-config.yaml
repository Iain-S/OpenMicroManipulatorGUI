# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v3.2.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
-   repo: local
    hooks:
    -   id: ruff-check
        name: ruff check
        entry: venv/bin/ruff check src/ommg tests
        language: system
        types: [python]
        pass_filenames: false
    -   id: ty-check
        name: ty check
        entry: venv/bin/ty check src/ommg --ignore unresolved-attribute --ignore invalid-argument-type --ignore unsupported-operator --ignore too-many-positional-arguments --ignore parameter-already-assigned --ignore invalid-return-type --ignore call-non-callable --ignore unresolved-import
        language: system
        types: [python]
        pass_filenames: false
